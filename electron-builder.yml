appId: com.mylab.desktop
productName: MyLab
copyright: Copyright © MyLab

directories:
  output: release
  buildResources: electron/resources

files:
  - electron/**/*
  - package.json

extraResources:
  - from: desktop-dist/api
    to: api
  - from: desktop-dist/app-server
    to: app-server

# Published to GitHub Releases on version tags (v*) so apps can auto-update.
# private + token are written into app-update.yml so installed apps can read
# private Releases (token comes from MYLAB_GH_UPDATE_TOKEN at build time).
publish:
  - provider: github
    owner: saurabhinno
    repo: mylab-manager
    private: true
    token: ${env.MYLAB_GH_UPDATE_TOKEN}
    releaseType: release

mac:
  category: public.app-category.medical
  target:
    - dmg
    - zip
  # Unsigned/local builds: hardened runtime blocks launch without Apple signing.
  hardenedRuntime: false
  identity: null

win:
  target:
    - nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  target:
    - AppImage
